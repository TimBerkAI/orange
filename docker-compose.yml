services:
  nginx:
    build:
      context: .
      dockerfile: container/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_files:/var/www/static:ro
    depends_on:
      - app
    networks:
      - internal

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      DB_HOST: db
      STATIC_ROOT: /var/www/static
    volumes:
      - static_files:/var/www/static
    depends_on:
      - db
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dental
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  postgres_data:
  static_files:

networks:
  internal:
    driver: bridge
