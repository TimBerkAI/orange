services:
  nginx:
    build:
      context: .
      dockerfile: container/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_files:/var/www/static:ro
    depends_on:
      - app
    networks:
      - internal

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      STATIC_ROOT: /var/www/static
    volumes:
      - static_files:/var/www/static
    depends_on:
      - db
      - redis
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  static_files:

networks:
  internal:
    driver: bridge
