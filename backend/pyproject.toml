[project]
name = "backend"
version = "0.1.0"
description = "Backend office"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.4,<6",
    "psycopg[binary]>=3.2,<4",
    "django-redis>=5.4,<6",
    "django-environ>=0.12,<1",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-xdist>=3.5,<4",
    "pytest-rerunfailures>=14,<15",
    "factory-boy>=3.3,<4",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "PT"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra -q --strict-markers --disable-warnings"
testpaths = ["apps"]
